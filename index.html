<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>NEGM DRIVE — Open City</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050608;
    font-family:Arial,"Tahoma",sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* LOADING */
#loading{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
      radial-gradient(circle at 50% 35%,#182033 0,#07090e 45%,#020204 100%);
    color:white;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:3px;
    color:#fff;
}

.logo span{
    color:#ff1d3d;
}

.loader{
    width:260px;
    height:5px;
    margin-top:25px;
    background:#222;
    border-radius:99px;
    overflow:hidden;
}

.loader i{
    display:block;
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#ff1638,#ff7b00);
    transition:.2s;
}

#loadText{
    margin-top:14px;
    color:#aaa;
    font-size:13px;
}

/* HUD */
#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    display:none;
}

.top{
    position:absolute;
    top:max(18px,env(safe-area-inset-top));
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.panel{
    background:rgba(5,8,13,.72);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(12px);
    border-radius:15px;
    padding:10px 14px;
    color:#fff;
    box-shadow:0 8px 30px #0008;
}

.speed{
    min-width:105px;
    text-align:center;
}

.speed b{
    display:block;
    font-size:34px;
    line-height:32px;
}

.speed small{
    color:#aaa;
}

.stats{
    text-align:right;
}

.stats strong{
    color:#ff3150;
}

/* CROSSHAIR */
#cross{
    position:absolute;
    left:50%;
    top:50%;
    width:25px;
    height:25px;
    transform:translate(-50%,-50%);
    opacity:.45;
}

#cross:before,
#cross:after{
    content:"";
    position:absolute;
    background:#fff;
}

#cross:before{
    width:25px;
    height:1px;
    top:12px;
}

#cross:after{
    width:1px;
    height:25px;
    left:12px;
}

/* BOTTOM */
.bottom{
    position:absolute;
    bottom:max(18px,env(safe-area-inset-bottom));
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
}

#controls{
    display:flex;
    gap:12px;
    pointer-events:auto;
}

.btn{
    width:65px;
    height:65px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(8,11,17,.75);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    user-select:none;
    box-shadow:0 8px 25px #0008;
}

.btn:active{
    transform:scale(.92);
    background:#ff173c;
}

#steer{
    display:flex;
    gap:10px;
}

#pedals{
    display:flex;
    gap:10px;
}

#nitro{
    position:absolute;
    right:50%;
    bottom:100px;
    transform:translateX(50%);
    width:100px;
    height:42px;
    border-radius:30px;
    border:1px solid #ff3150;
    color:#fff;
    background:linear-gradient(180deg,#a90c28,#410713);
    font-weight:bold;
    pointer-events:auto;
}

#minimap{
    width:130px;
    height:130px;
    border-radius:15px;
    background:rgba(0,0,0,.65);
    border:1px solid #ffffff22;
    overflow:hidden;
}

#mapCanvas{
    width:100%;
    height:100%;
}

/* MENU */
#menuBtn{
    pointer-events:auto;
    width:45px;
    height:45px;
    border-radius:13px;
    border:1px solid #ffffff22;
    background:#090d14cc;
    color:white;
    font-size:22px;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:#0009;
    backdrop-filter:blur(10px);
}

.menuBox{
    width:min(90%,380px);
    padding:25px;
    border-radius:25px;
    background:#0b0f17f5;
    border:1px solid #ffffff18;
    color:white;
    text-align:center;
}

.menuBox h2{
    margin-top:0;
}

.menuButton{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:14px;
    color:white;
    background:#171d29;
    font-size:16px;
}

.menuButton.primary{
    background:linear-gradient(90deg,#ff1638,#ff5b00);
}

/* MOBILE */
@media(max-width:700px){
    .logo{font-size:30px}
    #minimap{width:100px;height:100px}
    .btn{width:59px;height:59px}
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="game"></div>

<!-- LOADING -->
<div id="loading">
    <div class="logo">NEGM <span>DRIVE</span></div>
    <div class="loader"><i id="bar"></i></div>
    <div id="loadText">جاري تجهيز المدينة...</div>
</div>

<!-- HUD -->
<div id="hud">

    <div class="top">

        <div class="panel stats">
            NEGM DRIVE<br>
            <small>OPEN CITY</small><br>
            <strong id="state">جاهز للقيادة</strong>
        </div>

        <div class="panel speed">
            <b id="speed">0</b>
            <small>KM/H</small>
        </div>

        <button id="menuBtn">☰</button>

    </div>

    <div id="cross"></div>

    <div class="bottom">

        <div id="controls">

            <div id="steer">
                <div class="btn" id="left">◀</div>
                <div class="btn" id="right">▶</div>
            </div>

            <div id="pedals">
                <div class="btn" id="brake">▼</div>
                <div class="btn" id="gas">▲</div>
            </div>

        </div>

        <canvas id="mapCanvas" width="200" height="200"></canvas>

    </div>

    <button id="nitro">⚡ NITRO</button>

</div>

<!-- MENU -->
<div id="menu">
    <div class="menuBox">

        <h2>NEGM DRIVE</h2>

        <p>
            مدينة مفتوحة — قيادة حرة
        </p>

        <button class="menuButton primary" id="resume">
            ▶ متابعة القيادة
        </button>

        <button class="menuButton" id="reset">
            ↻ إعادة السيارة
        </button>

        <button class="menuButton" id="day">
            ☀ تبديل الوقت
        </button>

    </div>
</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    /*
      بما إن الملفات عندك مرفوعة في GitHub،
      اتركها هكذا لو index.html في نفس مكان ملفات GLB.

      لو حطيت ملفات السيارات داخل cars/
      غيّرها إلى "cars/"
    */
    CAR_PATH:"./",

    CITY_PATH:"./",

    /*
      أسماء نماذج Kenney المحتملة.
      البرنامج يجربهم واحدًا واحدًا.
    */
    CAR_FILES:[
        "car.glb",
        "sedan.glb",
        "sports.glb",
        "taxi.glb",
        "hatchback.glb",
        "convertible.glb",
        "truck.glb",
        "veh-sports.glb",
        "vehicle.glb"
    ],

    ROAD_FILES:[
        "road-straight.glb",
        "road-straight-half.glb",
        "road-square.glb",
        "road-intersection.glb",
        "road-curve.glb",
        "road-roundabout.glb"
    ]
};

/* =========================================================
   THREE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x86b7df);

scene.fog = new THREE.Fog(
    0x86b7df,
    90,
    420
);

const camera = new THREE.PerspectiveCamera(
    68,
    innerWidth/innerHeight,
    .05,
    1000
);

camera.position.set(
    0,
    5,
    10
);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.7)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("game")
    .appendChild(renderer.domElement);

/* =========================================================
   LIGHT
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xcce6ff,
        0x334433,
        2.1
    );

scene.add(hemi);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    -100,
    160,
    80
);

sun.castShadow=true;

sun.shadow.mapSize.set(
    2048,
    2048
);

sun.shadow.camera.left=-180;
sun.shadow.camera.right=180;
sun.shadow.camera.top=180;
sun.shadow.camera.bottom=-180;

scene.add(sun);

/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);

const roadGroup =
    new THREE.Group();

world.add(roadGroup);

const buildings =
    new THREE.Group();

world.add(buildings);

const props =
    new THREE.Group();

world.add(props);

/* =========================================================
   MATERIALS
========================================================= */

const asphalt =
    new THREE.MeshStandardMaterial({
        color:0x25272b,
        roughness:.92
    });

const lineMat =
    new THREE.MeshBasicMaterial({
        color:0xf5f5f5
    });

const grassMat =
    new THREE.MeshStandardMaterial({
        color:0x2d6634,
        roughness:1
    });

const buildingMats=[
    0x6e7681,
    0x9a715b,
    0x536778,
    0x777d87,
    0x4d5967,
    0x806a52
].map(c =>
    new THREE.MeshStandardMaterial({
        color:c,
        roughness:.85
    })
);

/* =========================================================
   GROUND
========================================================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            900,
            900
        ),
        grassMat
    );

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

world.add(ground);

/* =========================================================
   ROAD BUILDER
========================================================= */

function makeRoad(
    x,
    z,
    width=10,
    length=100,
    rotation=0
){

    const r =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .12,
                length
            ),
            asphalt
        );

    r.position.set(
        x,
        .03,
        z
    );

    r.rotation.y=rotation;

    r.receiveShadow=true;

    roadGroup.add(r);

    /* center lines */

    for(
        let i=-length/2+4;
        i<length/2;
        i+=8
    ){

        const line =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .16,
                    .015,
                    4
                ),
                lineMat
            );

        line.position.set(
            x,
            .105,
            z+i
        );

        line.rotation.y=rotation;

        roadGroup.add(line);
    }
}

/* =========================================================
   CITY GRID
========================================================= */

function buildCity(){

    const spacing=65;

    const size=7;

    for(
        let i=-size;
        i<=size;
        i++
    ){

        makeRoad(
            i*spacing,
            0,
            11,
            900
        );

        makeRoad(
            0,
            i*spacing,
            11,
            900,
            Math.PI/2
        );
    }

    /* sidewalks */

    const sidewalkMat =
        new THREE.MeshStandardMaterial({
            color:0x999b9d,
            roughness:.95
        });

    for(
        let i=-size;
        i<=size;
        i++
    ){

        const a =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    2,
                    .2,
                    900
                ),
                sidewalkMat
            );

        a.position.set(
            i*spacing-7,
            .11,
            0
        );

        world.add(a);

        const b=a.clone();

        b.position.x=
            i*spacing+7;

        world.add(b);
    }
}

/* =========================================================
   BUILDINGS
========================================================= */

function addBuilding(x,z){

    const w=
        15+Math.random()*18;

    const d=
        15+Math.random()*18;

    const h=
        10+Math.random()*55;

    const mat=
        buildingMats[
            Math.floor(
                Math.random()*
                buildingMats.length
            )
        ];

    const building=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            mat
        );

    building.position.set(
        x,
        h/2,
        z
    );

    building.castShadow=true;
    building.receiveShadow=true;

    buildings.add(building);

    /* rooftop */

    if(Math.random()>.65){

        const roof=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    w*.7,
                    2,
                    d*.7
                ),
                mat
            );

        roof.position.set(
            x,
            h+1,
            z
        );

        roof.castShadow=true;

        buildings.add(roof);
    }
}

function buildBuildings(){

    const spacing=65;

    for(
        let gx=-6;
        gx<=6;
        gx++
    ){

        for(
            let gz=-6;
            gz<=6;
            gz++
        ){

            /* skip road zones */

            const x=gx*spacing;
            const z=gz*spacing;

            const positions=[
                [x-24,z-24],
                [x+24,z-24],
                [x-24,z+24],
                [x+24,z+24]
            ];

            positions.forEach(p=>{

                if(
                    Math.random()>.12
                ){
                    addBuilding(
                        p[0]+
                        (Math.random()*8-4),
                        p[1]+
                        (Math.random()*8-4)
                    );
                }

            });
        }
    }
}

/* =========================================================
   STREET LIGHTS
========================================================= */

function addStreetLight(x,z){

    const poleMat=
        new THREE.MeshStandardMaterial({
            color:0x33373c,
            metalness:.5,
            roughness:.6
        });

    const pole=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .12,
                .15,
                6,
                8
            ),
            poleMat
        );

    pole.position.set(
        x,
        3,
        z
    );

    pole.castShadow=true;

    props.add(pole);

    const lamp=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .35,
                12,
                8
            ),
            new THREE.MeshBasicMaterial({
                color:0xffe9ad
            })
        );

    lamp.position.set(
        x,
        6.1,
        z
    );

    props.add(lamp);
}

function buildLights(){

    for(
        let i=-6;
        i<=6;
        i++
    ){

        for(
            let j=-6;
            j<=6;
            j++
        ){

            if(
                Math.random()>.55
            ){

                addStreetLight(
                    i*65+5,
                    j*65+5
                );
            }
        }
    }
}

/* =========================================================
   TREE
========================================================= */

function addTree(x,z){

    const trunk=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .25,
                .35,
                3,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x5c3924
            })
        );

    trunk.position.set(
        x,
        1.5,
        z
    );

    props.add(trunk);

    const crown=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.3,
                10,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x236b35
            })
        );

    crown.position.set(
        x,
        4,
        z
    );

    crown.castShadow=true;

    props.add(crown);
}

function buildTrees(){

    for(
        let i=0;
        i<450;
        i++
    ){

        const x=
            (Math.random()-.5)*820;

        const z=
            (Math.random()-.5)*820;

        /* don't place directly on roads */

        if(
            Math.abs(
                Math.round(x/65)*65-x
            )<10
        ) continue;

        if(
            Math.abs(
                Math.round(z/65)*65-z
            )<10
        ) continue;

        addTree(x,z);
    }
}

/* =========================================================
   CAR
========================================================= */

let player;
let carVisual;

function createFallbackCar(){

    const car=
        new THREE.Group();

    const bodyMat=
        new THREE.MeshStandardMaterial({
            color:0xd91532,
            metalness:.65,
            roughness:.25
        });

    const black=
        new THREE.MeshStandardMaterial({
            color:0x101217,
            roughness:.3,
            metalness:.2
        });

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.25,
                .55,
                4.4
            ),
            bodyMat
        );

    body.position.y=.65;

    body.castShadow=true;

    car.add(body);

    const cabin=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.65,
                .65,
                2.1
            ),
            black
        );

    cabin.position.set(
        0,
        1.05,
        -.15
    );

    cabin.castShadow=true;

    car.add(cabin);

    /* wheels */

    const wheelGeo=
        new THREE.CylinderGeometry(
            .43,
            .43,
            .3,
            18
        );

    for(
        const x of [-1.08,1.08]
    ){

        for(
            const z of [-1.45,1.45]
        ){

            const wheel=
                new THREE.Mesh(
                    wheelGeo,
                    black
                );

            wheel.rotation.z=
                Math.PI/2;

            wheel.position.set(
                x,
                .43,
                z
            );

            wheel.castShadow=true;

            car.add(wheel);
        }
    }

    /* headlights */

    const headMat=
        new THREE.MeshBasicMaterial({
            color:0xffffff
        });

    for(
        const x of [-.62,.62]
    ){

        const lamp=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .3,
                    .12,
                    .08
                ),
                headMat
            );

        lamp.position.set(
            x,
            .75,
            -2.22
        );

        car.add(lamp);
    }

    return car;
}

/* =========================================================
   GLB CAR LOADER
========================================================= */

const loader=
    new GLTFLoader();

async function tryLoadCar(){

    for(
        const file of CONFIG.CAR_FILES
    ){

        try{

            const gltf=
                await new Promise(
                    (resolve,reject)=>{

                        loader.load(
                            CONFIG.CAR_PATH+file,
                            resolve,
                            undefined,
                            reject
                        );

                    }
                );

            carVisual=gltf.scene;

            carVisual.traverse(
                o=>{

                    if(o.isMesh){

                        o.castShadow=true;
                        o.receiveShadow=true;

                    }

                }
            );

            carVisual.scale.set(
                1,
                1,
                1
            );

            return true;

        }catch(e){}
    }

    return false;
}

/* =========================================================
   PLAYER
========================================================= */

player=
    new THREE.Group();

player.position.set(
    0,
    .15,
    0
);

scene.add(player);

carVisual=
    createFallbackCar();

player.add(carVisual);

/* =========================================================
   TRAFFIC
========================================================= */

const traffic=[];

function createTrafficCar(){

    const c=
        createFallbackCar();

    const color=[
        0xffffff,
        0x111111,
        0x1565c0,
        0xffa000,
        0x29a56a,
        0xeeeeee
    ][
        Math.floor(
            Math.random()*6
        )
    ];

    c.traverse(o=>{

        if(
            o.isMesh &&
            o.material &&
            o.material.color &&
            o.material.color.getHex()===0xd91532
        ){

            o.material=
                o.material.clone();

            o.material.color.setHex(
                color
            );
        }

    });

    return c;
}

function spawnTraffic(){

    for(
        let i=0;
        i<28;
        i++
    ){

        const car=
            createTrafficCar();

        const axis=
            Math.random()>.5;

        if(axis){

            car.position.set(
                (Math.floor(Math.random()*13)-6)*65,
                .15,
                (Math.random()-.5)*850
            );

            car.rotation.y=
                Math.PI/2;

        }else{

            car.position.set(
                (Math.random()-.5)*850,
                .15,
                (Math.floor(Math.random()*13)-6)*65
            );

            car.rotation.y=0;
        }

        world.add(car);

        traffic.push({
            obj:car,
            axis,
            speed:
                4+
                Math.random()*8
        });
    }
}

/* =========================================================
   PHYSICS
========================================================= */

let velocity=0;

let steering=0;

let throttle=false;
let braking=false;
let nitro=false;

const MAX_SPEED=38;
const REVERSE_SPEED=12;

function updateCar(dt){

    let acceleration=0;

    if(throttle)
        acceleration+=24;

    if(braking)
        acceleration-=38;

    if(
        !throttle &&
        !braking
    ){

        acceleration+=
            velocity>0
            ?-9
            :9;
    }

    velocity+=
        acceleration*dt;

    const max=
        nitro
        ?72
        :MAX_SPEED;

    velocity=
        THREE.MathUtils.clamp(
            velocity,
            -REVERSE_SPEED,
            max
        );

    if(
        Math.abs(velocity)>.5
    ){

        const turn=
            steering*
            (velocity/18)*
            dt;

        player.rotation.y-=turn;

    }

    const forward=
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        player.quaternion
    );

    player.position.addScaledVector(
        forward,
        velocity*dt
    );

    /* boundaries */

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -430,
            430
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -430,
            430
        );
}

/* =========================================================
   TRAFFIC UPDATE
========================================================= */

function updateTraffic(dt){

    traffic.forEach(t=>{

        if(t.axis){

            t.obj.position.z+=
                t.speed*dt;

            if(
                t.obj.position.z>440
            )
                t.obj.position.z=-440;

        }else{

            t.obj.position.x+=
                t.speed*dt;

            if(
                t.obj.position.x>440
            )
                t.obj.position.x=-440;
        }

    });
}

/* =========================================================
   CAMERA
========================================================= */

const cameraTarget=
    new THREE.Vector3();

function updateCamera(dt){

    const behind=
        new THREE.Vector3(
            0,
            4.5,
            9
        );

    behind.applyQuaternion(
        player.quaternion
    );

    const desired=
        player.position
            .clone()
            .add(behind);

    camera.position.lerp(
        desired,
        1-Math.pow(.001,dt)
    );

    cameraTarget.copy(
        player.position
    );

    cameraTarget.y+=1;

    camera.lookAt(
        cameraTarget
    );
}

/* =========================================================
   INPUT
========================================================= */

function hold(
    element,
    down,
    up
){

    const start=e=>{
        e.preventDefault();
        down();
    };

    const end=e=>{
        e.preventDefault();
        up();
    };

    element.addEventListener(
        "pointerdown",
        start
    );

    element.addEventListener(
        "pointerup",
        end
    );

    element.addEventListener(
        "pointercancel",
        end
    );

    element.addEventListener(
        "pointerleave",
        end
    );
}

hold(
    document.getElementById("left"),
    ()=>steering=1,
    ()=>steering=0
);

hold(
    document.getElementById("right"),
    ()=>steering=-1,
    ()=>steering=0
);

hold(
    document.getElementById("gas"),
    ()=>throttle=true,
    ()=>throttle=false
);

hold(
    document.getElementById("brake"),
    ()=>braking=true,
    ()=>braking=false
);

hold(
    document.getElementById("nitro"),
    ()=>nitro=true,
    ()=>nitro=false
);

/* KEYBOARD */

const keys={};

addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;

        if(e.key==="Escape")
            toggleMenu();
    }
);

addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);

function keyboardInput(){

    steering=0;

    if(
        keys["a"]||
        keys["arrowleft"]
    )
        steering=1;

    if(
        keys["d"]||
        keys["arrowright"]
    )
        steering=-1;

    throttle=
        !!(
            keys["w"]||
            keys["arrowup"]
        );

    braking=
        !!(
            keys["s"]||
            keys["arrowdown"]
        );

    nitro=
        !!keys["shift"];
}

/* =========================================================
   MINIMAP
========================================================= */

const map=
    document.getElementById(
        "mapCanvas"
    );

const ctx=
    map.getContext("2d");

function drawMap(){

    ctx.clearRect(
        0,0,
        200,200
    );

    ctx.fillStyle="#07100b";

    ctx.fillRect(
        0,0,200,200
    );

    ctx.strokeStyle="#555";
    ctx.lineWidth=2;

    for(
        let i=15;
        i<200;
        i+=15
    ){

        ctx.beginPath();
        ctx.moveTo(i,0);
        ctx.lineTo(i,200);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0,i);
        ctx.lineTo(200,i);
        ctx.stroke();
    }

    const px=
        100+
        player.position.x/8;

    const pz=
        100+
        player.position.z/8;

    ctx.fillStyle="#ff203f";

    ctx.beginPath();

    ctx.arc(
        THREE.MathUtils.clamp(px,5,195),
        THREE.MathUtils.clamp(pz,5,195),
        5,
        0,
        Math.PI*2
    );

    ctx.fill();
}

/* =========================================================
   DAY / NIGHT
========================================================= */

let night=false;

function toggleDay(){

    night=!night;

    if(night){

        scene.background.set(
            0x02040b
        );

        scene.fog.color.set(
            0x02040b
        );

        sun.intensity=.35;
        hemi.intensity=.35;

    }else{

        scene.background.set(
            0x86b7df
        );

        scene.fog.color.set(
            0x86b7df
        );

        sun.intensity=3;
        hemi.intensity=2.1;
    }
}

/* =========================================================
   MENU
========================================================= */

const menu=
    document.getElementById("menu");

function toggleMenu(){

    menu.style.display=
        menu.style.display==="flex"
        ?"none"
        :"flex";
}

document
    .getElementById("menuBtn")
    .onclick=toggleMenu;

document
    .getElementById("resume")
    .onclick=toggleMenu;

document
    .getElementById("day")
    .onclick=toggleDay;

document
    .getElementById("reset")
    .onclick=()=>{

        player.position.set(
            0,.15,0
        );

        player.rotation.set(
            0,0,0
        );

        velocity=0;

        toggleMenu();
    };

/* =========================================================
   LOADING
========================================================= */

function progress(
    value,
    text
){

    document
        .getElementById("bar")
        .style.width=
        value+"%";

    document
        .getElementById("loadText")
        .textContent=text;
}

/* =========================================================
   START
========================================================= */

async function start(){

    progress(
        10,
        "بناء الطرق..."
    );

    buildCity();

    progress(
        30,
        "بناء المدينة..."
    );

    buildBuildings();

    progress(
        50,
        "إضافة الإنارة..."
    );

    buildLights();

    progress(
        65,
        "إضافة الأشجار..."
    );

    buildTrees();

    progress(
        75,
        "تجهيز السيارات..."
    );

    const realCar=
        await tryLoadCar();

    if(realCar){

        player.remove(
            carVisual
        );

        player.add(
            carVisual
        );

        carVisual.scale.set(
            .9,
            .9,
            .9
        );

        document
            .getElementById("state")
            .textContent=
            "سيارة 3D جاهزة";

    }else{

        document
            .getElementById("state")
            .textContent=
            "وضع السيارة الاحتياطي";
    }

    spawnTraffic();

    progress(
        100,
        "تم تشغيل المدينة!"
    );

    setTimeout(
        ()=>{

            document
                .getElementById(
                    "loading"
                )
                .style.display="none";

            document
                .getElementById(
                    "hud"
                )
                .style.display="block";

        },
        500
    );
}

/* =========================================================
   GAME LOOP
========================================================= */

let last=
    performance.now();

function animate(now){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            (now-last)/1000,
            .05
        );

    last=now;

    keyboardInput();

    updateCar(dt);

    updateTraffic(dt);

    updateCamera(dt);

    drawMap();

    document
        .getElementById("speed")
        .textContent=
        Math.round(
            Math.abs(velocity)*3.6
        );

    renderer.render(
        scene,
        camera
    );
}

start();

animate(last);

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>
